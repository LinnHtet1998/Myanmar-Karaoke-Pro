
name: Build Myanmar Karaoke APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          mkdir -p project
          unzip -o MyanmarKaraokePro_Source.zip -d project

          SOURCE_ZIP="$(find project -type f -name 'MyanmarKaraokePro_Source.zip' -print -quit)"

          if [ -n "$SOURCE_ZIP" ]; then
            mkdir -p project/source
            unzip -o "$SOURCE_ZIP" -d project/source
            PROJECT_DIR="$(dirname "$(find project/source -type f -name 'settings.gradle.kts' -print -quit)")"
          else
            PROJECT_DIR="$(dirname "$(find project -type f -name 'settings.gradle.kts' -print -quit)")"
          fi

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          cp -R "$PROJECT_DIR"/. .

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Karaoke-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
